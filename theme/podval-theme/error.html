<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ошибка сервера — Подвальный Принт</title>
<style>
  :root {
    --black: #0a0a0a;
    --white: #f5f5f5;
    --accent: #ff6a00;
    --gray: #888;
    --border: rgba(255,255,255,0.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--black);
    color: var(--white);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }

  .error-standalone__code {
    font-size: clamp(72px, 18vw, 160px);
    font-weight: 900;
    letter-spacing: -4px;
    line-height: 1;
    position: relative;
    color: transparent;
    background: linear-gradient(135deg, var(--accent) 0%, #ff3d00 100%);
    -webkit-background-clip: text;
    background-clip: text;
    margin-bottom: 16px;
    animation: pulse-glow 3s ease-in-out infinite;
  }
  @keyframes pulse-glow {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.3); }
  }

  .error-standalone__title {
    font-size: clamp(20px, 4vw, 32px);
    font-weight: 700;
    margin-bottom: 12px;
  }
  .error-standalone__desc {
    color: var(--gray);
    font-size: 15px;
    line-height: 1.6;
    max-width: 480px;
    margin-bottom: 32px;
  }
  .error-standalone__actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .error-standalone__btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 28px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.2s;
    cursor: pointer;
    border: none;
  }
  .error-standalone__btn--primary {
    background: var(--accent);
    color: var(--black);
  }
  .error-standalone__btn--primary:hover {
    filter: brightness(1.15);
    transform: translateY(-1px);
  }
  .error-standalone__btn--secondary {
    background: transparent;
    color: var(--white);
    border: 1px solid rgba(255,255,255,0.15);
  }
  .error-standalone__btn--secondary:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .error-standalone__footer {
    position: fixed;
    bottom: 24px;
    color: var(--gray);
    font-size: 12px;
  }
  .error-standalone__footer a {
    color: var(--accent);
    text-decoration: none;
  }
</style>
</head>
<body>

  <div class="error-standalone__code" id="error-code">500</div>
  <h1 class="error-standalone__title" id="error-title">Внутренняя ошибка сервера</h1>
  <p class="error-standalone__desc" id="error-desc">
    Что-то пошло не так на нашей стороне. Мы уже работаем над решением проблемы.
    Попробуйте обновить страницу через пару минут.
  </p>

  <div class="error-standalone__actions">
    <a href="/" class="error-standalone__btn error-standalone__btn--primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      На главную
    </a>
    <button class="error-standalone__btn error-standalone__btn--secondary" onclick="location.reload()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18">
        <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>
      Обновить
    </button>
  </div>

  <div class="error-standalone__footer">
    <a href="/">Подвальный Принт</a>
  </div>

<script>
// Определяем код ошибки из URL или meta
(function(){
  var codes = {
    '500': { title: 'Внутренняя ошибка сервера', desc: 'Что-то пошло не так на нашей стороне. Мы уже работаем над решением. Попробуйте обновить страницу через пару минут.' },
    '502': { title: 'Ошибка шлюза', desc: 'Сервер временно недоступен. Обычно это решается за несколько минут. Попробуйте обновить страницу.' },
    '503': { title: 'Сервис временно недоступен', desc: 'Сайт на техническом обслуживании или перегружен. Мы скоро вернёмся — попробуйте через пару минут.' },
    '504': { title: 'Тайм-аут шлюза', desc: 'Серверу потребовалось слишком много времени для ответа. Попробуйте обновить страницу.' },
  };
  // Попытка определить код из query string (?code=503) или задать 500 по умолчанию
  var params = new URLSearchParams(window.location.search);
  var code = params.get('code') || '500';
  if (codes[code]) {
    document.getElementById('error-code').textContent = code;
    document.getElementById('error-title').textContent = codes[code].title;
    document.getElementById('error-desc').textContent = codes[code].desc;
  }
})();
</script>
</body>
</html>
