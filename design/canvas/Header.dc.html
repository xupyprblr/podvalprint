<script type="text/x-dc" data-dc-script data-props='{"mobile":{"editor":"boolean","default":false},"open":{"editor":"boolean","default":false},"current":{"editor":"enum","options":["none","print","templates","editor","deadlock","prices","delivery","contacts"],"default":"none"},"count":{"editor":"int","default":2},"toggle":{"editor":"boolean","default":false},"night":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":72}}'>
class Component extends DCLogic {
  renderVals() {
    const mobile = this.props.mobile ?? false;
    const open = this.props.open ?? false;
    const current = this.props.current ?? 'none';
    const count = this.props.count ?? 2;
    const keys = ['print', 'templates', 'editor', 'deadlock', 'prices', 'delivery', 'contacts'];
    const cur = {};
    keys.forEach((k) => { cur[k] = k === current ? 'page' : undefined; });
    return {
      mobile, desktop: !mobile, open, closed: !open, openStr: open ? 'true' : 'false',
      cur, count, hasCount: count > 0,
      toggle: this.props.toggle ?? false, nightStr: (this.props.night ?? false) ? 'true' : 'false'
    };
  }
}
</script>
