<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Каталог шаблонов · мобильный</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/pp/tokens.css">
<link rel="stylesheet" href="ds/pp/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600..900&family=Golos+Text:wght@400..900&family=Onest:wght@400..900&display=swap">
<style>body{margin:0}</style>
</helmet>
<div data-theme="light" style="width: 390px; background: var(--bg); color: var(--ink); font-family: var(--font-text); overflow: hidden">
  <dc-import name="Header" mobile="{{yes}}" count="{{zero}}" hint-size="390px,56px"></dc-import>
  <div style="padding: 4px 16px 0"><nav aria-label="Хлебные крошки"><ol class="pp-crumbs" style="font-size: 13px"><li><a href="#">Главная</a></li><li><span aria-current="page">Шаблоны</span></li></ol></nav></div>
  <section style="padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 10px">
    <h1 style="margin: 0; font: 800 34px/1.04 var(--font-display); letter-spacing: -0.025em">Шаблоны с вашими фото</h1>
    <p class="pp-text pp-muted">Подставьте фото и текст — превью на футболке сразу.</p>
  </section>
  <div class="pp-tabs" role="tablist" style="padding: 0 8px"><a class="pp-tab" role="tab" aria-selected="true" href="?group=all" style="display: inline-flex; align-items: center; text-decoration: none">Все</a><a class="pp-tab" role="tab" aria-selected="false" href="?group=photo" style="display: inline-flex; align-items: center; text-decoration: none">С фото</a><a class="pp-tab" role="tab" aria-selected="false" href="?group=free" style="display: inline-flex; align-items: center; text-decoration: none">Свободные</a><a class="pp-tab" role="tab" aria-selected="false" href="?group=pair" style="display: inline-flex; align-items: center; text-decoration: none">Парные</a></div>
  <div style="display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; white-space: nowrap"><a class="pp-chip" aria-pressed="true" href="?for=dad">Папе</a><a class="pp-chip" aria-pressed="false" href="?for=mom">Маме</a><a class="pp-chip" aria-pressed="false" href="?for=couple">Паре</a><a class="pp-chip" aria-pressed="false" href="?for=friend">Другу</a><a class="pp-chip" aria-pressed="false" href="?for=holiday">Праздник</a></div>
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 16px 12px"><span class="pp-small">6 шаблонов · Папе</span><button class="pp-btn pp-btn--secondary pp-btn--s"><svg class="pp-icon pp-icon--s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>Изделие · сортировка</button></div>
  <section style="padding: 0 16px 32px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px">
    <sc-for list="{{cards}}" as="c" hint-placeholder-count="6">
      <article class="pp-card">
        <div class="pp-card__media pp-card__media--sq pp-tex-concrete">
          <div class="pp-card__badges" style="top: 8px; left: 8px"><span class="pp-badge pp-badge--outline" style="font-size: 10px; padding: 3px 5px">{{c.badge}}</span></div>
          <svg viewBox="0 0 300 300" style="width: 82%; margin-top: 14px" aria-hidden="true"><path d="M105 40 70 52 30 90l22 38 26-16v150h144V112l26 16 22-38-40-38-35-12c-7 18-25 28-45 28s-38-10-45-28z" fill="{{c.fill}}" stroke="#7d7a72" stroke-width="2"></path><rect x="112" y="98" width="76" height="80" fill="#c9b48f"></rect><text x="150" y="146" text-anchor="middle" font-family="Onest" font-weight="900" font-size="22" fill="#121212">{{c.word}}</text></svg>
        </div>
        <div class="pp-card__body" style="padding: 10px; gap: 6px">
          <h3 class="pp-card__title" style="font-size: 15px"><a href="#">{{c.name}}</a></h3>
          <span class="pp-price pp-price--s" style="font-size: 17px"><span class="pp-price__from" style="font-size: 13px">от</span>00 Br</span>
        </div>
      </article>
    </sc-for>
  </section>
  <div style="padding: 0 16px 48px; display: grid; gap: 12px; justify-items: center">
    <nav aria-label="Страницы" class="pp-pager"><a href="?page=1" aria-current="page">1</a><a href="?page=2">2</a><a href="?page=3">3</a></nav>
    <a class="pp-btn pp-btn--secondary pp-btn--block" href="#">Собрать свой в конструкторе</a>
  </div>
  <dc-import name="Footer" mobile="{{yes}}" hint-size="390px,560px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":2400}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      yes: true, zero: 0,
      cards: [
        { name: 'Слово из фото', badge: '4 фото + текст', fill: '#ffffff', word: 'ПАПА' },
        { name: 'Фото и отчество', badge: '1 фото + текст', fill: '#ffffff', word: 'ФОТО' },
        { name: 'Постер-коллаж', badge: '3–9 фото', fill: '#151515', word: '3×3' },
        { name: 'Полароид', badge: '1 фото', fill: '#d8c7a6', word: 'ФОТО' },
        { name: 'Папа и сын', badge: 'пара', fill: '#4a4a48', word: '1+1' },
        { name: 'Сетка 4 фото', badge: '4 фото', fill: '#ffffff', word: '2×2' }
      ]
    };
  }
}
</script>
</body>
</html>
