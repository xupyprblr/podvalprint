<!doctype html>
<html lang="ru"><head><meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>Конструктор · мобильный</title>

<link rel="stylesheet" href="../canvas/ds/pp/tokens.css">
<link rel="stylesheet" href="../canvas/ds/pp/components/bundle.css">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600..900&amp;family=Golos+Text:wght@400..900&amp;family=Onest:wght@400..900&amp;family=Caveat:wght@600&amp;family=Lobster&amp;family=Rubik:wght@700&amp;display=swap">
<style>body{margin:0}</style>
</head>
<body>






<div data-theme="light" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--surface); color: var(--ink); font-family: var(--font-text)">
  <div style="height: 52px; display: flex; align-items: center; gap: 4px; padding: 0 4px; background: var(--bg); border-bottom: 1.5px solid var(--line)">
    <button class="pp-btn pp-btn--icon pp-btn--ghost" aria-label="Назад"><svg class="pp-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
    <b style="font: 700 15px var(--font-display); flex: 1">Оверсайз</b>
    <button class="pp-btn pp-btn--icon pp-btn--ghost" aria-label="Отменить"><svg class="pp-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" aria-hidden="true"><path d="M9 14L4 9l5-5"></path><path d="M4 9h11a5 5 0 0 1 0 10h-3"></path></svg></button>
    <button class="pp-btn pp-btn--icon pp-btn--ghost" aria-label="Повторить" disabled=""><svg class="pp-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" aria-hidden="true"><path d="M15 14l5-5-5-5"></path><path d="M20 9H9a5 5 0 0 0 0 10h3"></path></svg></button>
    <button class="pp-btn pp-btn--icon pp-btn--ghost" aria-label="Помощь"><svg class="pp-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 16.8v.4"></path></svg></button>
  </div>
  <div style="padding: 8px 12px; overflow-x: auto; background: var(--bg)">
    <div class="pp-zones" role="tablist" aria-label="Зона печати">
      <button class="pp-zone" role="tab" aria-selected="true">Перед<span class="pp-zone__dot"></span></button>
      <button class="pp-zone" role="tab" aria-selected="false">Спина</button>
      <button class="pp-zone" role="tab" aria-selected="false">Л. рукав</button>
      <button class="pp-zone" role="tab" aria-selected="false">П. рукав</button>
    </div>
  </div>

  <div style="position: absolute; left: 15px; top: 116px; width: 360px; height: 360px">
    <svg viewBox="0 0 300 300" style="position: absolute; inset: 0; width: 100%; height: 100%" aria-hidden="true">
      <path d="M100 38 52 54 18 108l34 24 18-12-4 146h168l-4-146 18 12 34-24-34-54-48-16c-8 18-28 26-50 26s-42-8-50-26z" fill="#151515"></path>
      
    </svg>
    <div style="position: absolute; left: 122px; top: 108px; width: 115px; height: 154px; border: 1.5px dashed #e9e7e1; box-sizing: border-box">
      
      
        <div style="position: absolute; left: 18px; top: 14px; width: 78px; height: 91px">
          <svg viewBox="0 0 120 140" style="position: absolute; inset: 0; width: 100%; height: 100%" aria-hidden="true"><rect width="120" height="140" fill="#d8c7a6"></rect><circle cx="60" cy="58" r="30" fill="#121212"></circle><circle cx="49" cy="54" r="9" fill="none" stroke="#ffd60a" stroke-width="3"></circle><circle cx="71" cy="54" r="9" fill="none" stroke="#ffd60a" stroke-width="3"></circle><text x="60" y="122" text-anchor="middle" font-family="Onest" font-weight="900" font-size="18" fill="#121212">КОТ</text></svg>
          <div style="position: absolute; inset: -1px; border: 1.5px solid #ffffff"></div><span style="position: absolute; right: -9px; bottom: -9px; width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 1.5px solid var(--ink)"></span><span style="position: absolute; left: -9px; top: -9px; width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 1.5px solid var(--ink)"></span>
        </div>
      
      
    </div>
    <span class="pp-printsize" style="position: absolute; left: 50%; top: 276px; transform: translateX(-50%); white-space: nowrap"><b>A4</b>21 × 25 см</span>
  </div>
  <div style="position: absolute; right: 12px; top: 116px">
    <span class="pp-status" role="status"><svg class="pp-icon pp-icon--s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"></path></svg>Всё в зоне печати</span>
    
    
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 500px; display: flex; gap: 8px; justify-content: center">
    <button aria-label="Белый" style="width: 52px; display: grid; gap: 4px; justify-items: center; background: none; border: 0; padding: 0; font: 500 11px var(--font-text); color: var(--ink-2)"><span style="width: 40px; height: 40px; border-radius: 4px; background: #fff; box-shadow: inset 0 0 0 1.5px var(--line-strong)"></span>Белый</button>
    <button aria-label="Чёрный, выбран" aria-pressed="true" style="width: 52px; display: grid; gap: 4px; justify-items: center; background: none; border: 0; padding: 0; font: 700 11px var(--font-text); color: var(--ink)"><span style="width: 40px; height: 40px; border-radius: 4px; background: #151515; box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink)"></span>Чёрный</button>
    <button aria-label="Графит" style="width: 52px; display: grid; gap: 4px; justify-items: center; background: none; border: 0; padding: 0; font: 500 11px var(--font-text); color: var(--ink-2)"><span style="width: 40px; height: 40px; border-radius: 4px; background: #4a4a48"></span>Графит</button>
    <button aria-label="Песочный" style="width: 52px; display: grid; gap: 4px; justify-items: center; background: none; border: 0; padding: 0; font: 500 11px var(--font-text); color: var(--ink-2)"><span style="width: 40px; height: 40px; border-radius: 4px; background: #d8c7a6"></span>Песок</button>
  </div>

  
    <div class="pp-objbar" role="toolbar" aria-label="Действия с объектом" style="position: absolute; left: 8px; right: 8px; bottom: 140px; justify-content: space-between">
      <button class="pp-btn pp-btn--icon pp-btn--s" aria-label="Повернуть"><svg class="pp-icon pp-icon--s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7"></path><path d="M20 4v5h-5"></path></svg></button>
      <button class="pp-btn pp-btn--icon pp-btn--s" aria-label="Масштаб"><svg class="pp-icon pp-icon--s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"></path></svg></button>
      <button class="pp-btn pp-btn--icon pp-btn--s" aria-label="По центру"><svg class="pp-icon pp-icon--s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M12 2v20"></path><rect x="6" y="6" width="12" height="5"></rect><rect x="8" y="14" width="8" height="5"></rect></svg></button>
      <button class="pp-btn pp-btn--icon pp-btn--s" aria-label="Дублировать"><svg class="pp-icon pp-icon--s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><rect x="8" y="8" width="13" height="13"></rect><path d="M16 8V3H3v13h5"></path></svg></button>
      <button class="pp-btn pp-btn--icon pp-btn--s" aria-label="Выше"><svg class="pp-icon pp-icon--s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><rect x="9" y="3" width="12" height="12"></rect><path d="M5 9H3v12h12v-2"></path></svg></button>
      <button class="pp-btn pp-btn--icon pp-btn--s" aria-label="Ниже"><svg class="pp-icon pp-icon--s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><rect x="3" y="9" width="12" height="12"></rect><path d="M9 5V3h12v12h-2"></path></svg></button>
      <button class="pp-btn pp-btn--icon pp-btn--s is-danger" aria-label="Удалить"><svg class="pp-icon pp-icon--s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M3 6h18M8 6V3h8v3M5 6l1 15h12l1-15M10 10v7M14 10v7"></path></svg></button>
      <span class="pp-objbar__sep" style="margin: 0"></span>
      <button class="pp-btn pp-btn--icon pp-btn--s" aria-label="Отменить"><svg class="pp-icon pp-icon--s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M9 14L4 9l5-5"></path><path d="M4 9h11a5 5 0 0 1 0 10h-3"></path></svg></button>
      <button class="pp-btn pp-btn--icon pp-btn--s" aria-label="Повторить" disabled=""><svg class="pp-icon pp-icon--s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M15 14l5-5-5-5"></path><path d="M20 9H9a5 5 0 0 0 0 10h3"></path></svg></button>
    </div>
  
  <div style="position: absolute; left: 8px; right: 8px; bottom: 140px">
    
    
    
  </div>

  

  <div class="pp-sheet" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 0 0; box-sizing: border-box">
    <div class="pp-sheet__grab" style="margin-bottom: 8px"></div>
    
    
    
    
      <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 16px 10px"><span class="pp-small">M, L · перед A4</span><span style="display: inline-flex; align-items: baseline; gap: 6px"><span class="pp-small">Итого</span><span class="pp-price pp-price--s">00 Br</span></span></div>
      
    
    <div style="display: grid; grid-template-columns: 1fr 1fr 1.3fr; border-top: 1.5px solid var(--line); height: 64px">
      <button style="display: grid; place-content: center; justify-items: center; gap: 2px; background: none; border: 0; font: 600 12px var(--font-text); color: var(--ink)"><svg class="pp-icon pp-icon--l" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M8 3L3 6l2 5 2-1v11h10V10l2 1 2-5-5-3c-.5 1.8-2 3-4 3S8.5 4.8 8 3z"></path></svg>Изделие</button>
      <button style="display: grid; place-content: center; justify-items: center; gap: 2px; background: none; border: 0; border-left: 1.5px solid var(--line); font: 600 12px var(--font-text); color: var(--ink)"><svg class="pp-icon pp-icon--l" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M12 3a9 9 0 0 0 0 18c1.4 0 2-1 1.6-2.2-.5-1.4.4-2.8 1.9-2.8H18a3 3 0 0 0 3-3c0-5.5-4-10-9-10z"></path><circle cx="7.5" cy="11" r="1"></circle><circle cx="10" cy="7" r="1"></circle><circle cx="15" cy="7.5" r="1"></circle></svg>Дизайн</button>
      <button class="pp-btn pp-btn--accent" style="height: 64px; border-radius: 0; border: 0; gap: 8px">В корзину<svg class="pp-icon pp-icon--l" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"></path></svg></button>
    </div>
  </div>
</div>
</body></html>
