<!doctype html>
<html lang="ru"><head><meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>Редактор шаблона · мобильный</title>

<link rel="stylesheet" href="../canvas/ds/pp/tokens.css">
<link rel="stylesheet" href="../canvas/ds/pp/components/bundle.css">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600..900&amp;family=Golos+Text:wght@400..900&amp;family=Onest:wght@400..900&amp;display=swap">
<style>body{margin:0}</style>
</head>
<body>






<div data-theme="light" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--font-text); overflow: hidden">
  <div style="height: 52px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 4px; border-bottom: 1.5px solid var(--line)">
    <button class="pp-btn pp-btn--icon pp-btn--ghost" aria-label="Назад"><svg class="pp-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
    <b style="flex: 1; text-align: center; font: 700 15px var(--font-display)">Фото в буквах</b>
    <button class="pp-btn pp-btn--icon pp-btn--ghost" aria-label="Закрыть"><svg class="pp-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"></path></svg></button>
  </div>
  <div class="pp-tex-concrete" style="height: 230px; flex: none; position: relative; display: grid; place-items: center">
    <svg viewBox="0 0 300 300" style="position: absolute; width: 230px; height: 230px" aria-hidden="true"><path d="M105 40 70 52 30 90l22 38 26-16v150h144V112l26 16 22-38-40-38-35-12c-7 18-25 28-45 28s-38-10-45-28z" fill="#ffffff" stroke="#7d7a72"></path></svg>
    <div style="position: relative; display: flex; gap: 1px; margin-top: 6px">
      <span class="pp-tex-concrete" style="font: 900 34px/0.9 var(--font-display); background-color: #b9a27a; -webkit-background-clip: text; background-clip: text; color: transparent">П</span><span class="pp-tex-concrete" style="font: 900 34px/0.9 var(--font-display); background-color: #8f7a58; -webkit-background-clip: text; background-clip: text; color: transparent">А</span><span class="pp-tex-concrete" style="font: 900 34px/0.9 var(--font-display); background-color: #a68f68; -webkit-background-clip: text; background-clip: text; color: transparent">П</span><span class="pp-tex-concrete" style="font: 900 34px/0.9 var(--font-display); background-color: #c9b48f; -webkit-background-clip: text; background-clip: text; color: transparent; outline: 1.5px solid var(--ink); outline-offset: 1px">А</span>
    </div>
    <span class="pp-label" style="position: absolute; left: 12px; top: 12px; color: var(--ink-2); font-size: 11px">Превью</span>
  </div>
  <div style="flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 0">
    <div class="pp-steps" style="--n: 4"><div class="pp-steps__head"><span class="pp-label">Шаг 1 из 4</span><span class="pp-small">Дальше: текст</span></div><ol class="pp-steps__bar"><li aria-current="step">Фото</li><li>Текст</li><li>Стиль</li><li>Изделие</li></ol></div>
    <div role="tablist" aria-label="Буквы" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px">
      <button role="tab" aria-selected="false" style="height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1.5px solid var(--line); border-radius: 4px; background: var(--bg); font: 800 17px var(--font-display); color: var(--ink)">П<span style="width: 16px; height: 16px; border-radius: 50%; background: var(--success); color: #fff; display: grid; place-items: center"><svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"></path></svg></span></button>
      <button role="tab" aria-selected="false" style="height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1.5px solid var(--line); border-radius: 4px; background: var(--bg); font: 800 17px var(--font-display); color: var(--ink)">А<span style="width: 16px; height: 16px; border-radius: 50%; background: var(--success); color: #fff; display: grid; place-items: center"><svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"></path></svg></span></button>
      <button role="tab" aria-selected="false" style="height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1.5px solid var(--line); border-radius: 4px; background: var(--bg); font: 800 17px var(--font-display); color: var(--ink)">П<span style="width: 16px; height: 16px; border-radius: 50%; background: var(--success); color: #fff; display: grid; place-items: center"><svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"></path></svg></span></button>
      <button role="tab" aria-selected="true" style="height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 2px solid var(--ink); border-radius: 4px; background: var(--surface); font: 800 17px var(--font-display); color: var(--ink)">А</button>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: baseline"><b style="font: 700 16px var(--font-display)">Буква А</b><span class="pp-label pp-muted">4 из 4</span></div>
    <div style="height: 196px; border-radius: 6px; background: var(--surface); position: relative; display: grid; place-items: center; overflow: hidden">
      <span class="pp-tex-concrete" style="font: 900 210px/0.8 var(--font-display); background-color: #c9b48f; -webkit-background-clip: text; background-clip: text; color: transparent">А</span>
      <span class="pp-label" style="position: absolute; left: 10px; bottom: 10px; font-size: 10px; color: var(--ink-2)">Фото: ребёнок</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px">
      <button class="pp-btn pp-btn--icon pp-btn--secondary pp-btn--s" aria-label="Уменьшить"><svg class="pp-icon pp-icon--s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M4 12h16"></path></svg></button>
      <div style="flex: 1; height: 4px; border-radius: 2px; background: var(--line); position: relative"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 40%; background: var(--ink)"></span><span style="position: absolute; left: 40%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: var(--bg); border: 2px solid var(--ink)" role="slider" aria-label="Масштаб" aria-valuenow="120"></span></div>
      <span class="pp-num" style="font-weight: 700">120%</span>
      <button class="pp-btn pp-btn--text pp-btn--s">Сбросить</button>
    </div>
  </div>
  <div style="padding: 12px 16px 16px; display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px; border-top: 1.5px solid var(--line)">
    <button class="pp-btn pp-btn--secondary pp-btn--l">Заменить фото</button>
    <button class="pp-btn pp-btn--primary pp-btn--l">Дальше: текст</button>
  </div>
</div>
</body></html>
