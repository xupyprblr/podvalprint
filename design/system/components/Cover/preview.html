<!-- @dsCard height=288 -->
<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Cover</title>
<style>
  html, body { margin: 0; background: var(--bg); }
  .cv { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--bg); }
  .cv svg { position: absolute; inset: 0; }
  .acc { fill: var(--accent); } .ink { fill: var(--ink); } .s2 { fill: var(--surface-2); } .glow { fill: var(--glow); }
  .stk { stroke: var(--ink); fill: none; stroke-width: 2; }
  .cv__txt { position: absolute; left: 40px; bottom: 32px; max-width: 440px; }
  .cv__name { margin: 0; font: 850 72px/.95 var(--font-display); letter-spacing: -0.035em; color: var(--ink); }
  [data-theme="dark"] .cv__name { font: 800 60px/.98 var(--font-deco); letter-spacing: -0.015em; }
  .cv__tag { margin: 12px 0 0; font: 400 14px/1.4 var(--font-text); color: var(--ink-2); }
</style></head>
<body>
<div class="cv">
<svg viewBox="0 0 960 288" width="960" height="288" aria-hidden="true">
  <!-- blocks: accent 256×192 (bleeds top), ink 192×128 (bleeds top/right), surface-2 192×160 (bleeds bottom/right), glow 24×24 — sides are space-5/space-8 multiples, square corners (radius-xs ~ 0)
       arrangement: one tall slab with satellites, everything right of x=480, bleeding off the top and right like a poster pasted on concrete
       pattern: "loud, bold, poster type → stripes at a spacing pitch" — the signal hazard band from .pp-hazard, pitch 24 (space-5), cut out of the accent slab's foot; plus one registration cross (the print-shop motif) on the concrete block
       scales: space-5 24, space-8 64, space-10 128; stroke = control border 2px -->
  <defs><pattern id="hz" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="24" class="ink"/></pattern></defs>
  <rect x="512" y="0" width="256" height="216" class="acc"/>
  <rect x="512" y="216" width="256" height="24" class="acc"/><rect x="512" y="216" width="256" height="24" fill="url(#hz)"/>
  <rect x="768" y="0" width="192" height="128" class="ink"/>
  <rect x="768" y="128" width="192" height="160" class="s2"/>
  <rect x="896" y="64" width="24" height="24" class="glow"/>
  <g class="stk"><circle cx="864" cy="208" r="18"/><path d="M864 168v80M824 208h80"/></g>
</svg>
<div class="cv__txt"><h1 class="cv__name">Подвальный Принт</h1><p class="cv__tag">Мастерская DTF-печати в Минске: бетон и сигнальный жёлтый днём, ночной путеводитель в разделе Deadlock.</p></div>
</div>
</body>
</html>
