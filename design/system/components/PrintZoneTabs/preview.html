<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PrintZoneTabs</title></head>
<body>
<div class="pv"><section class="pp-theme"><div class="pp-zones" role="tablist" aria-label="Зона печати"><button class="pp-zone" role="tab" aria-selected="true">Перед <span class="pp-zone__dot" aria-label="есть печать"></span></button><button class="pp-zone" role="tab" aria-selected="false">Спина <span class="pp-zone__dot" aria-label="есть печать"></span></button><button class="pp-zone is-hover" role="tab" aria-selected="false">Левый рукав</button><button class="pp-zone" role="tab" aria-selected="false">Правый рукав</button></div><p class="pp-small">Точка — на зоне есть печать (в тёмной — точка свечения). Выбрана «Перед», ховер «Левый рукав».</p></section><section data-theme="dark"><div class="pp-zones" role="tablist" aria-label="Зона печати"><button class="pp-zone" role="tab" aria-selected="true">Перед <span class="pp-zone__dot" aria-label="есть печать"></span></button><button class="pp-zone" role="tab" aria-selected="false">Спина <span class="pp-zone__dot" aria-label="есть печать"></span></button><button class="pp-zone is-hover" role="tab" aria-selected="false">Левый рукав</button><button class="pp-zone" role="tab" aria-selected="false">Правый рукав</button></div><p class="pp-small">Точка — на зоне есть печать (в тёмной — точка свечения). Выбрана «Перед», ховер «Левый рукав».</p></section></div>
</body>
